# «Наш атлас»: our additions on top of the official self-hosted Supabase compose files.
# Layered last in COMPOSE_FILE (see install.sh). Values come from .env on the server; secrets never live in git.
services:
  auth:
    environment:
      # login emails: our own template from the site, 6-digit code valid for an hour
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: https://nash-atlas.ru/email/login.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: https://nash-atlas.ru/email/login.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Код для входа в «Наш атлас»"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Код для входа в «Наш атлас»"
      GOTRUE_MAILER_OTP_EXP: "3600"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      # the same limits the cloud project had: 30 login emails an hour, one a minute per address
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "30"
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # custom OAuth providers (Yandex ID) are created through the admin API by yandex.sh
      GOTRUE_CUSTOM_OAUTH_ENABLED: "true"

  functions:
    environment:
      VERIFY_JWT: "false"
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      POSTBOX_API_KEY: ${POSTBOX_API_KEY:-}
      SEND_EMAIL_HOOK_SECRET: ${SEND_EMAIL_HOOK_SECRET:-}

  # the database and its pooler are reachable only inside the server, never from the internet
  supavisor:
    ports: !reset []
